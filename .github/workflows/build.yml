name: Build
on: [push, pull_request]

# A push supersedes the one before it; there is no value in finishing the older
# matrix, and the queueing was costing more wall clock than the builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  app_id: inputstream.airplay

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC build"
            os: ubuntu-latest
            CC: gcc
            CXX: g++
            artifact: x86_64
          - name: "Linux Clang build"
            os: ubuntu-latest
            CC: clang
            CXX: clang++
          - name: "macOS build"
            os: macos-latest
            CC: clang
            CXX: clang++
          - name: "Linux GCC build (Omega)"
            os: ubuntu-latest
            kodi_ref: Omega
            CC: gcc
            CXX: g++
          # The route a distribution takes, and the only one that works without
          # a network. Also the strictest warnings, so what is already true
          # stays true for code doing pointer arithmetic over network buffers.
          - name: "Linux GCC build (aarch64)"
            os: ubuntu-24.04-arm
            CC: gcc
            CXX: g++
            artifact: aarch64
          - name: "Linux GCC build (unpacked UxPlay, -Werror)"
            os: ubuntu-latest
            CC: gcc
            CXX: g++
            uxplay_source: true
            werror: true
    steps:
    # master is Piers, the series repo-binary-addons currently tracks. Build
    # against Omega too, so a change that only compiles against the newest
    # dev-kit is caught here rather than by the build farm.
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: ${{ matrix.kodi_ref || 'master' }}
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libplist-dev
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install openssl@3 libplist
    - name: Read the UxPlay pin
      id: uxplay
      run: |
        cd ${{ github.workspace }}/${app_id}
        echo "version=$(sed -n 's/.*UXPLAY_VERSION "\(.*\)".*/\1/p' CMakeLists.txt)" >> $GITHUB_OUTPUT
    - name: Cache the UxPlay tarball
      if: matrix.uxplay_source
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/uxplay-tarball
        key: uxplay-${{ steps.uxplay.outputs.version }}
    - name: Unpack UxPlay
      if: matrix.uxplay_source
      run: |
        mkdir -p ${{ github.workspace }}/uxplay-tarball ${{ github.workspace }}/uxplay
        f=${{ github.workspace }}/uxplay-tarball/${{ steps.uxplay.outputs.version }}.tar.gz
        [ -f "$f" ] || curl -fsSL -o "$f" \
          https://github.com/FDH2/UxPlay/archive/${{ steps.uxplay.outputs.version }}.tar.gz
        sha256sum -c <<<"$(cat ${{ github.workspace }}/${app_id}/depends/common/uxplay/uxplay.sha256)  $f"
        tar -xzf "$f" --strip-components=1 -C ${{ github.workspace }}/uxplay
    - name: Prepare
      run: |
        mkdir -p ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}
        echo ${app_id} ${{ github.workspace }}/${app_id} > ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
    - name: Configure
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        cmake \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX=${{ github.workspace }} \
          -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/xbmc/addons \
          ${{ github.workspace }}/xbmc/cmake/addons
    - name: Build
      # The add-on's own cmake runs here, inside the ExternalProject, not in
      # the configure step above -- so this is where it has to see the
      # environment. ADDON_EXTRA_ARGS cannot carry it: Kodi's buildsystem feeds
      # that to an add-on's depends rather than to the add-on.
      env:
        UXPLAY_SOURCE_DIR: ${{ matrix.uxplay_source && format('{0}/uxplay', github.workspace) || '' }}
        AIRPLAY_STRICT_WARNINGS: ${{ matrix.werror && 'ON' || '' }}
      run: cmake --build ${app_id}/build 2>&1 | tee ${{ github.workspace }}/build.log
    - name: Check the build used the unpacked UxPlay
      if: matrix.uxplay_source
      run: |
        # The job exists to cover the offline route; without this it silently
        # built the depends route instead and still passed.
        grep -q "using UxPlay from ${{ github.workspace }}/uxplay" ${{ github.workspace }}/build.log
    - name: Check the strict warnings were applied
      if: matrix.werror
      run: grep -q "strict warnings on" ${{ github.workspace }}/build.log

    # Run against the built add-on rather than the source tree: addon.xml is
    # generated from addon.xml.in during the build, and the checker reads it.
    - name: Check add-on
      if: matrix.name == 'Linux GCC build'
      run: |
        python3 -m pip install --quiet kodi-addon-checker
        # Matched on the trailing addons/<id>/addon.xml: the workspace path
        # itself contains the add-on's name, so a looser pattern quietly
        # matches one of Kodi's own bundled add-ons and passes for the wrong
        # thing.
        addon_xml=$(find ${{ github.workspace }}/${app_id} \
                    -path "*/addons/${app_id}/addon.xml" | head -1)
        if [ -z "${addon_xml}" ]; then
          echo "no built add-on found to check" >&2
          exit 1
        fi
        kodi-addon-checker --branch=piers "$(dirname "${addon_xml}")"

    - name: Collect the built add-on
      if: matrix.artifact
      run: |
        out=${{ github.workspace }}/artifact/${app_id}
        mkdir -p "$out"
        base=${{ github.workspace }}/${app_id}/build/build/depends
        cp -a "$base"/lib/kodi/addons/${app_id}/. "$out"/
        cp -a "$base"/share/kodi/addons/${app_id}/. "$out"/
        # A .so and the daemon, or the add-on cannot load and cannot run.
        test -e "$out"/${app_id}.so
        test -x "$out"/airplay-receiver
        find "$out" -maxdepth 1 -type f | sort
    - name: Keep the built add-on
      if: matrix.artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.app_id }}-${{ matrix.artifact }}
        path: ${{ github.workspace }}/artifact
        if-no-files-found: error

  format:
    name: "clang-format"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Pinned. The repo's .clang-format is Kodi's, and an unpinned clang-format
    # would move with the runner image, so the tree would drift in and out of
    # compliance without anyone changing it.
    - run: python3 -m pip install --quiet "clang-format==18.1.8"
    - run: clang-format --version
    - run: clang-format --dry-run --Werror src/proto.h src/addon/*.h src/addon/*.cpp src/receiver/*.c

  debian:
    name: "Debian package"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts debhelper cmake pkg-config \
                                libssl-dev libplist-dev lintian
    # kodi-addon-dev is not in the runner's archive, so the package cannot be
    # built end to end here. What this does catch is the part that broke: the
    # build reaching the network for UxPlay, which a real build chroot forbids.
    - name: Check the build does not fetch UxPlay
      run: |
        # Not "if ... | tee": that tests tee's exit status, not the rule's.
        rc=0
        debian/rules override_dh_auto_configure > out.txt 2>&1 || rc=$?
        cat out.txt
        if [ "$rc" -eq 0 ]; then
          echo "expected debian/rules to stop without an unpacked UxPlay" >&2
          exit 1
        fi
        grep -q "no UxPlay at" out.txt
    - name: Lint the source package
      run: |
        lintian --version
        # The tree ships debian/changelog.in, which the Kodi add-on tooling
        # fills in at build time; dpkg-source needs the real thing, so stand one
        # up from the same template with the version the add-on declares.
        version=$(sed -n 's/.*  version="\([0-9.]*\)".*/\1/p' inputstream.airplay/addon.xml.in | head -1)
        sed -e "s/@ADDON_VERSION@/${version}/" \
            -e "s/@DEBIAN_VERSION@/1/" \
            -e "s/@DEBIAN_DISTRO@/unstable/" \
            -e "s/@DEBIAN_DATE@/$(date -R)/" \
            debian/changelog.in > debian/changelog
        head -1 debian/changelog
        # lintian takes packages, not control files. A source package can be
        # built without configuring anything, which is as far as this runner
        # gets -- kodi-addon-dev is not in its archive.
        dpkg-source --build .
        dsc=$(ls ../kodi-inputstream-airplay_*.dsc)
        echo "linting $dsc"
        # native-package-with-dash-version is inherited from Kodi's own add-on
        # packaging, which generates exactly this pairing; source-is-missing
        # fires on UxPlay's minified web assets, which are not built here.
        tags=debian-watch-file-is-missing,no-manual-page,source-is-missing
        tags=$tags,native-package-with-dash-version
        lintian --fail-on error,warning --suppress-tags "$tags" "$dsc"
